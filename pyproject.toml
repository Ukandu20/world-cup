[project]
name = "world-cup-2026-dashboard"
version = "0.1.0"
description = "Dataset-building scripts and a Streamlit dashboard for preseason World Cup 2026 tournament projections."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "streamlit>=1.36,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "plotly>=5.22,<7",
    "scikit-learn>=1.4,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".cache",
    ".git",
    ".pytest_cache",
    "__pycache__",
    "data",
    "INT-World Cup",
    "pytest-cache-files-*",
]

[tool.isort]
profile = "black"
skip_gitignore = true
skip = [
    ".agents",
    ".cache",
    ".dist",
    ".git",
    ".venv",
    "INT-World Cup",
    "__pycache__",
    "archived_logs",
    "data",
    "latest_logs",
]
extend_skip_glob = [
    "pytest-cache-files-*/*",
]
